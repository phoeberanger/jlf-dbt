version: 2

sources:
  - name: bronze
    database: AwsDataCatalog
    schema: jlf_bronze
    freshness:
      warn_after: {count: 1, period: day}
      error_after: {count: 2, period: day}
    loaded_at_field: "cast(dt as date)"
    tables:
      - name: bronze_checkouts_raw
        description: "Raw checkout and checkin events from S3 Bronze layer"
      - name: children_dim
        description: "Child dimension written by Lambda on registration. One JSON file per child."
      - name: monthly_honorees
        description: "Honoree history written by approver Lambda on each approval. One JSON file per honoree per month. Used by fct_monthly_rankings for repeat-prevention logic instead of static seed."
